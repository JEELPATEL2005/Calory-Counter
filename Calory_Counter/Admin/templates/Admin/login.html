{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #0f0c29; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: #1a1a2e; padding: 40px; border-radius: 12px; width: 380px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: none; font-size: 14px; }
        .btn { width: 100%; padding: 12px; background: #e94560; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn:hover { background: #c81e45; }
        .error { color: #e94560; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="box">
    <h2>🔐 Admin Panel Login</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{% url 'admin_login' %}">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Admin Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" class="btn">Login</button>
    </form>
</div>
</body>
</html>
