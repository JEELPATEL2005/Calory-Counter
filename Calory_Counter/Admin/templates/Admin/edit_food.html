{% extends "admin_layout.html" %}

{% block title %}Add food - Admin{% endblock %}

{% block page_title %}
	<i class="fas fa-plus"></i>
	{% if food %}Edit{% else %}Add{% endif %} Food
{% endblock %}

{% block page_content %}
<div class="admin-form">
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">Food Name *</label>
                <input type="text" id="name" name="name" value="{{ food.name|default_if_none:'' }}" required>
            </div>

            <div class="form-group">
                <label for="meal_type">Meal Type *</label>
                <select id="meal_type" name="meal_type" required>
                    <option value="">Select Meal</option>
                    <option value="breakfast" {% if food.meal_type == "breakfast" %}selected{% endif %}>Breakfast</option>
                    <option value="lunch" {% if food.meal_type == "lunch" %}selected{% endif %}>Lunch</option>
                    <option value="dinner" {% if food.meal_type == "dinner" %}selected{% endif %}>Dinner</option>
                    <option value="snack" {% if food.meal_type == "snack" %}selected{% endif %}>Snack</option>
                </select>
            </div>

            <div class="form-group">
                <label for="calories_100g">Calories per 100g</label>
                <input type="number" id="calories_100g" name="calories_100g" step="0.01" value="{{ food.calories_100g|default_if_none:100 }}">
            </div>

            <div class="form-group">
                <label for="protein">Protein (g)</label>
                <input type="number" id="protein" name="protein" step="0.01" value="{{ food.protein|default_if_none:0 }}">
            </div>

            <div class="form-group">
                <label for="carbs">Carbs (g)</label>
                <input type="number" id="carbs" name="carbs" step="0.01" value="{{ food.carbs|default_if_none:0 }}">
            </div>

            <div class="form-group">
                <label for="fat">Fat (g)</label>
                <input type="number" id="fat" name="fat" step="0.01" value="{{ food.fat|default_if_none:0 }}">
            </div>

            <div class="form-group">
                <label for="serving_grams">Serving Grams</label>
                <input type="number" id="serving_grams" name="serving_grams" step="0.1" value="{{ food.serving_grams|default_if_none:100 }}">
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="verified" name="verified" {% if food and food.verified %}checked{% endif %}>
                    <label for="verified" style="margin: 0;">Verified</label>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Save Food
                </button>
                <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>

</div>

{% endblock %}
