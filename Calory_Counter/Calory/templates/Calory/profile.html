{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Setup - Calory Counter</title>
    <link rel="stylesheet" href="{% static 'css/user_style.css' %}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="auth-page-wrapper">
      <div class="auth-container">
        <div class="form-header">
          <h2>👤 Complete Your Profile</h2>
          <p class="form-subtitle">Let's set up your health profile</p>
        </div>

        <div class="progress-indicator">
          <div class="progress-step active">
            <div class="step-number">1</div>
            <div class="step-label">Personal</div>
          </div>
          <div class="progress-step">
            <div class="step-number">2</div>
            <div class="step-label">Physical</div>
          </div>
          <div class="progress-step">
            <div class="step-number">3</div>
            <div class="step-label">Lifestyle</div>
          </div>
        </div>

        <div class="info-box">
          <i class="fas fa-info-circle"></i>
          Provide accurate information to get personalized calorie
          recommendations
        </div>

        <form method="post" class="meal-form">
          {% csrf_token %}

          <div class="form-grid">
            <div class="form-group">
              <label for="age">Age</label>
              <div class="input-wrapper">
                <i class="fas fa-birthday-cake"></i>
                <input
                  type="number"
                  id="age"
                  name="age"
                  placeholder="Years"
                  min="1"
                  max="150"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label for="height">Height</label>
              <div class="input-wrapper">
                <i class="fas fa-arrows-alt-v"></i>
                <input
                  type="number"
                  id="height"
                  name="height"
                  placeholder="cm"
                  min="50"
                  max="250"
                  required
                />
              </div>
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label for="weight">Weight</label>
              <div class="input-wrapper">
                <i class="fas fa-weight"></i>
                <input
                  type="number"
                  id="weight"
                  name="weight"
                  placeholder="kg"
                  min="20"
                  max="300"
                  step="0.1"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label for="gender">Gender</label>
              <div class="input-wrapper">
                <i class="fas fa-venus-mars"></i>
                <select id="gender" name="gender" required>
                  <option value="">Select Gender</option>
                  <option value="M">Male</option>
                  <option value="F">Female</option>
                </select>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="activity">Activity Level</label>
            <div class="input-wrapper">
              <i class="fas fa-dumbbell"></i>
              <select id="activity" name="activity" required>
                <option value="">Select Activity Level</option>
                <option value="low">Low - Sedentary</option>
                <option value="medium">Medium - Moderately Active</option>
                <option value="high">High - Very Active</option>
              </select>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn">
              <i class="fas fa-check-circle"></i> Save Profile & Continue
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
