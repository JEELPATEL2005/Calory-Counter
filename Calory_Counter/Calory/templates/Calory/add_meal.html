{% extends "user_layout.html" %} 

{% block title %}Add Meal{% endblock %} 

{% block page_title %}
    <i class="fas fa-plus-circle"></i>
    Add Meal 
{% endblock %} 

{% block page_content %}
<div class="container">
  <div class="box">
    <div class="form-header">
      <h2>🍽️ Add New Meal</h2>
      <p class="form-subtitle">Track your daily nutrition intake</p>
    </div>

    <div class="date-info">
      <i class="fas fa-calendar-alt"></i>
      <span><strong>Date:</strong> {{ today|date:"l, F j, Y" }}</span>
    </div>

    <form method="POST" class="meal-form">
      {% csrf_token %}
      <input type="hidden" name="date" value="{{ today }}" />

      <!-- Meal Type -->
      <div class="form-group">
        <label for="meal">Meal Type</label>
        <div class="input-wrapper">
          <i class="fas fa-utensils"></i>
          <select id="meal" name="meal" required>
            <option value="">Select Meal Type</option>
            <option value="breakfast">🍳 Breakfast</option>
            <option value="lunch">🍽️ Lunch</option>
            <option value="dinner">🌙 Dinner</option>
            <option value="snack">🍪 Snack</option>
          </select>
        </div>
      </div>

      <!-- Food -->
      <div class="form-group">
        <label for="food">Food Item</label>
        <div class="input-wrapper">
          <i class="fas fa-apple-alt"></i>
          <select id="food" name="food" required>
            <option value="">Select meal type first</option>
          </select>
        </div>
      </div>

      <!-- Quantity -->
      <div class="form-group">
        <label for="qty">Quantity (servings)</label>
        <div class="input-wrapper">
          <i class="fas fa-weight"></i>
          <input
            type="number"
            id="qty"
            name="qty"
            step="0.1"
            min="0.1"
            placeholder="e.g., 1.5"
            required
          />
        </div>
      </div>

      <!-- Submit Button -->
      <div class="form-actions">
        <button type="submit" class="btn">
          <i class="fas fa-plus"></i> Add Meal
        </button>
      </div>
    </form>

  </div>
</div>

<!-- FOODS DATA FROM DJANGO -->
<script>
  const FOODS = {{ foods|safe }};
</script>

<!-- FILTER SCRIPT -->
<script>
  const mealSelect = document.getElementById("meal");
  const foodSelect = document.getElementById("food");

  function loadFoods(type) {
    foodSelect.innerHTML = '<option value="">Select Food</option>';

    const filteredFoods = FOODS.filter((f) => f.meal_type === type);

    if (filteredFoods.length === 0) {
      foodSelect.innerHTML = '<option value="">No foods available</option>';
      return;
    }

    filteredFoods.forEach((food) => {
      const option = document.createElement("option");
      option.value = food.id;
      option.textContent = food.name;
      foodSelect.appendChild(option);
    });
  }

  mealSelect.addEventListener("change", function () {
    loadFoods(this.value);
  });
</script>
{% endblock %}
