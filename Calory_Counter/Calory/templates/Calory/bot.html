{% extends "user_layout.html" %}

{% block title %}Bot{% endblock %}

{% block page_title %}Bot{% endblock %}

{% block page_content %}
<div class="bot-wrapper">
    <div class="bot-container">
        
        <!-- Header -->
        <div class="bot-header">
            <h2>
                <i class="fas fa-robot"></i> AI Nutrition Bot
            </h2>
            <p class="bot-subtitle">Ask me anything about your nutrition and fitness goals</p>
        </div>

        <!-- Chat Display -->
        <div class="chat-box" id="chat">
            <div class="empty-state">
                <i class="fas fa-comments"></i>
                <p>Start a conversation with the AI Bot</p>
            </div>
        </div>

        <!-- Input Section -->
        <div class="input-section">
            <div class="input-wrapper">
                <i class="fas fa-comment-dots"></i>
                <input 
                    type="text" 
                    id="q" 
                    placeholder="Ask anything about nutrition..."
                    onkeypress="if(event.key==='Enter') send()"
                >
            </div>
            <button class="send-btn" onclick="send()">
                <i class="fas fa-paper-plane"></i> Send
            </button>
        </div>

    </div>
</div>


<script>

function cleanText(text){

  // Remove markdown symbols
  return text
    .replace(/\*\*/g, "")
    .replace(/###/g, "")
    .replace(/\*/g, "")
    .replace(/#/g, "")
    .replace(/\n+/g, "<br>");
}


function send(){

 let msg = document.getElementById("q").value;
 if(msg=="") return;

 let chat = document.getElementById("chat");

 chat.innerHTML += `
   <div class="user-msg">
     <b>You:</b> ${msg}
   </div>
 `;


 fetch("/bot/api/",{

   method:"POST",

   headers:{
     "Content-Type":"application/json",
     "X-CSRFToken": csrftoken
   },

   body: JSON.stringify({ text: msg })

 })

 .then(r => r.json())

 .then(d => {

   let reply = cleanText(d.reply);

   chat.innerHTML += `
     <div class="bot-msg">
       <b>Bot:</b><br>${reply}
     </div>
   `;

   chat.scrollTop = chat.scrollHeight;

 });


 document.getElementById("q").value = "";
}


// CSRF
function getCookie(name){

 let cookieValue=null;

 if(document.cookie && document.cookie!==""){

  const cookies=document.cookie.split(";");

  for(let i=0;i<cookies.length;i++){

   const cookie=cookies[i].trim();

   if(cookie.startsWith(name+"=")){

    cookieValue=decodeURIComponent(
      cookie.substring(name.length+1)
    );

    break;
   }
  }
 }

 return cookieValue;
}

const csrftoken = getCookie("csrftoken");

</script>

{% endblock %}
